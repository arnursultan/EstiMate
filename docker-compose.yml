version: '3.8'

services:
  db:
    image: postgres:13
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    env_file:
      - ./.env
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_DB: ${DB_NAME}
    restart: always

  redis:
    image: redis:6-alpine
    restart: always
    volumes:
      - redis_data:/data

  web:
    build: .
    command: >
      sh -c "./entrypoint.sh &&
             python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             daphne -b 0.0.0.0 -p 8000 backend.asgi:application"
    depends_on:
      - db
      - redis
    env_file:
      - ./.env
    volumes:
      - .:/app
      - ./static:/app/static
      - ./media:/app/media
      - ./staticfiles:/app/staticfiles
    ports:
      - "8000:8000"
    restart: always

  celery:
    build: .
    command: >
      sh -c "./entrypoint.sh && celery -A backend worker -l info"
    depends_on:
      - db
      - redis
    env_file:
      - ./.env
    volumes:
      - .:/app
    restart: always

  celery-beat:
    build: .
    command: >
      sh -c "./entrypoint.sh && celery -A backend beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler"
    depends_on:
      - db
      - redis
    env_file:
      - ./.env
    volumes:
      - .:/app
    restart: always

volumes:
  postgres_data:
  redis_data:
